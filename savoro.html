<!DOCTYPE html>
<html lang="en" data-mood="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E31C13">
<title>Savoro · Barcelona, rated by its own</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a friend from the barri who knows where to eat right now. Short, warm, a bit cheeky, never corporate.
IDEA: the street itself: Cerdà's chamfered blocks, the panot pavement tile, the chalk menú board by the door.
PICTURE: the live block map of Eixample and Gràcia, warm where it is alive right now, a smile on every open kitchen.
COLOUR and TYPE: Savoro red fields, ink and white; amber only ever draws a smile. Archivo expanded for posters, Archivo for text, Caveat for chalk.
LAYOUT: phone-first app shell with bottom tabs and a raised smile button; desktop gets a side rail and two columns.
*/
:root{
  --red:#E31C13;--red-d:#B8140D;--amber:#FFA800;--ink0:#1B1310;
  --disp:"Archivo","Arial Black","Helvetica Neue",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --chalk:"Caveat","Chalkboard SE","Marker Felt","Segoe Print","Bradley Hand",cursive;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
  --r:22px;--rs:14px;
  --panot:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'><g fill='none' stroke='white' stroke-opacity='.16' stroke-width='1.6'><path d='M0 14A14 14 0 0 0 14 0M42 0a14 14 0 0 0 14 14M56 42a14 14 0 0 0-14 14M14 56A14 14 0 0 0 0 42'/><path d='M28 15c5 5 5 8 0 13c-5-5-5-8 0-13zM28 41c-5-5-5-8 0-13c5 5 5 8 0 13zM15 28c5-5 8-5 13 0c-5 5-8 5-13 0zM41 28c-5 5-8 5-13 0c5-5 8-5 13 0z'/><circle cx='28' cy='28' r='2.4'/></g></svg>");
}
[data-mood=day]{--bg:#FAF7F3;--surface:#FFFFFF;--soft:#F2ECE5;--ink:#1B1310;--muted:#6B5F57;--line:#E8DFD5;--cold:#E6DED3;--street:#FAF7F3;--sea:#DCE9EA;--smile:#F29400;--acc:#D01810;--hero:#E31C13;--onhero:#FFFFFF;--shadow:0 1px 0 rgba(40,20,10,.04),0 14px 34px -20px rgba(60,25,10,.35)}
[data-mood=dinner]{--bg:#2A0A08;--surface:#3A110E;--soft:#46160F;--ink:#FFEEE7;--muted:#E3BCB1;--line:#5A231D;--cold:#4B1D18;--street:#2A0A08;--sea:#2A1A1F;--smile:#FFA800;--acc:#FF8277;--hero:#E31C13;--onhero:#FFFFFF;--shadow:0 20px 44px -24px rgba(0,0,0,.75)}
[data-mood=late]{--bg:#110D0C;--surface:#1D1715;--soft:#271F1C;--ink:#F7EEE8;--muted:#B8A89E;--line:#332925;--cold:#2B2320;--street:#110D0C;--sea:#141819;--smile:#FFA800;--acc:#FF5A4E;--hero:#C3160E;--onhero:#FFFFFF;--shadow:0 20px 44px -24px rgba(0,0,0,.85)}
*,*::before,*::after{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background-color .6s var(--ease),color .6s var(--ease)}
body.locked{overflow:hidden}
h1,h2,h3,h4,p,figure,blockquote{margin:0}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
svg{display:block}
:focus{outline:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:3px;border-radius:12px}
h1[tabindex="-1"]:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.x{font-family:var(--disp);font-stretch:125%;font-weight:850;letter-spacing:-.025em;line-height:1.02;text-wrap:balance}
.xc{font-family:var(--disp);font-stretch:75%;font-weight:800;letter-spacing:-.01em;line-height:1}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.lab{font-size:.84rem;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* logo */
.logo{font-family:var(--disp);font-stretch:112%;font-weight:900;font-size:27px;letter-spacing:-.055em;color:var(--red);display:inline-flex;align-items:flex-end;line-height:1;padding-bottom:7px}
[data-mood=late] .logo,[data-mood=dinner] .logo{color:#FF3B2F}
.logo .o{position:relative;display:inline-block}
.logo .o svg{position:absolute;left:50%;bottom:-.26em;width:.74em;height:.32em;transform:translateX(-50%);overflow:visible}
.logo:hover .o svg{animation:grin .7s var(--spring)}
@keyframes grin{40%{transform:translateX(-50%) scaleY(1.8) scaleX(1.12)}}

/* shell */
.app{min-height:100vh}
.rail{display:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .3s}
.top.sc{border-bottom-color:var(--line)}
.top .logo{margin-right:auto}
.here{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:99px;background:var(--soft);font-size:.82rem;font-weight:700;white-space:nowrap}
.here i{width:7px;height:7px;border-radius:50%;background:#26B35A;box-shadow:0 0 0 3px rgba(38,179,90,.2)}
.ib{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;transition:transform .25s var(--spring),background .2s}
.ib:hover{background:var(--soft)}
.ib:active{transform:scale(.9)}
.ib svg{width:22px;height:22px}
.ib.solid{background:var(--surface);border:1px solid var(--line)}
main{padding:4px 16px 120px;max-width:1240px;margin:0 auto}
.view{transition:opacity .28s var(--ease),transform .28s var(--ease)}
.view.out{opacity:0;transform:translateY(-6px)}
.view.in{transition:none;opacity:0;transform:translateY(14px)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));transition:background-color .6s}
.tabs a,.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.7rem;font-weight:700;color:var(--muted);text-align:center}
.tabs svg{width:24px;height:24px}
.tabs .on{color:var(--ink)}
.tabs .on svg{color:var(--red)}
[data-mood=late] .tabs .on svg,[data-mood=dinner] .tabs .on svg{color:#FF3B2F}
.tabs .fab .bub{width:60px;height:60px;margin-top:-26px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 26px -10px rgba(227,28,19,.7),0 0 0 5px var(--surface);transition:transform .3s var(--spring)}
.tabs .fab:active .bub{transform:scale(.9)}
.tabs .fab .bub svg{width:32px;height:32px;color:#fff}
@media (min-width:960px){
  .app{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:26px 16px 18px;border-right:1px solid var(--line)}
  .rail .logo{font-size:34px;margin:0 0 26px 10px}
  .rail .nv{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:14px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
  .rail .nv svg{width:22px;height:22px}
  .rail .nv:hover{background:var(--soft);color:var(--ink)}
  .rail .nv.on{background:var(--ink);color:var(--bg)}
  .rail .btn{margin:16px 0 8px}
  .rail .foot2{margin-top:auto;display:grid;gap:2px}
  .tabs,.top .logo{display:none}
  .top{padding:14px 32px}
  .top .sbar{display:flex}
  main{padding:8px 32px 64px}
}
.sbar{display:none;flex:1;max-width:520px;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:99px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-weight:600;margin-right:auto}
.sbar:hover{border-color:var(--ink)}
.sbar svg{width:20px;height:20px;color:var(--ink)}
.sbar kbd{margin-left:auto;font:700 .72rem var(--body);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

/* controls */
.btn{min-height:50px;padding:0 22px;border-radius:99px;background:var(--red);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;transition:transform .25s var(--spring),box-shadow .25s,opacity .2s;box-shadow:0 10px 22px -14px rgba(227,28,19,.8)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px}
.btn .arc{width:20px;height:9px}
.btn.ink{background:var(--ink);color:var(--bg);box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--ink)}
.btn.white{background:#fff;color:var(--red);box-shadow:none}
.btn.sm{min-height:44px;padding:0 16px;font-size:.9rem}
.btn.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.row{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 6px;scroll-padding:0 16px}
.chips.row::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 15px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s var(--spring)}
.chip:hover{border-color:var(--ink)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed=true],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:17px;height:17px}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button,.seg a{min-height:40px;padding:0 14px;border-radius:99px;font-size:.86rem;font-weight:750;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s}
.seg [aria-pressed=true],.seg [aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -3px rgba(0,0,0,.3)}
.switch{display:inline-flex;align-items:center;gap:12px;min-height:44px;font-weight:700;font-size:.92rem;text-align:left}
.switch .tr{width:50px;height:30px;border-radius:99px;background:var(--cold);position:relative;flex:none;transition:background .3s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch[aria-checked=true] .tr{background:var(--red)}
.switch[aria-checked=true] .tr::after{transform:translateX(20px)}
.save{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--soft);transition:transform .3s var(--spring),background .2s,color .2s;position:relative;z-index:2}
.save svg{width:20px;height:20px}
.save[aria-pressed=true]{background:var(--red);color:#fff}
.save[aria-pressed=true] svg path{fill:currentColor}
.save:active{transform:scale(.85)}
.follow{min-height:40px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:800;font-size:.86rem;white-space:nowrap;transition:transform .25s var(--spring),background .2s,color .2s;position:relative;z-index:2;flex:none}
.follow[aria-pressed=true]{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.follow:active{transform:scale(.94)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.76rem;font-weight:800;flex:none;letter-spacing:.02em}
.avs{display:inline-flex}
.avs .av{width:26px;height:26px;font-size:.6rem;margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.avs .av:first-child{margin-left:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:800;padding:5px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tag.open::before{content:"";width:7px;height:7px;border-radius:50%;background:#26B35A}
.tag.warn{background:#FFE4D6;color:#8A2208}
.tag.loc{background:#1B1310;color:#FFD27A}
.tag.split{background:#EDE4FF;color:#3E2479}
.tag.new{background:#DFF3E6;color:#155C32}
[data-mood=dinner] .tag.warn,[data-mood=late] .tag.warn{background:#5A1F10;color:#FFC9AE}
[data-mood=dinner] .tag.split,[data-mood=late] .tag.split{background:#2F2347;color:#D9CCFF}
[data-mood=dinner] .tag.new,[data-mood=late] .tag.new{background:#14361F;color:#A8E6BE}
[data-mood=dinner] .tag.loc,[data-mood=late] .tag.loc{background:#FFD27A;color:#1B1310}
.paid{display:inline-flex;align-items:center;gap:7px;font-size:.74rem;font-weight:850;padding:4px 10px;border-radius:6px;border:1.5px solid currentColor;white-space:nowrap}
.paid i{width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* sections */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:34px 0 14px}
.sh h2{font-size:clamp(1.45rem,5vw,2rem)}
.sh>h2,.sh>div{flex:1 1 0}
.sh a,.sh button{font-weight:800;font-size:.9rem;color:var(--acc);min-height:44px;display:inline-flex;align-items:center;white-space:nowrap}
.sh p{font-size:.88rem;color:var(--muted)}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,300px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none;scroll-padding:0 16px}
.strip::-webkit-scrollbar{display:none}
.strip>*{scroll-snap-align:start}
@media (min-width:960px){.strip{margin:0;padding:2px 0 14px}.chips.row{margin:0;padding:2px 0 6px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:background-color .6s,border-color .6s}

/* home */
.hello{padding:14px 0 14px;display:grid;gap:8px}
.hello .greet{font-size:.95rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.hello h1{font-size:clamp(2.1rem,9.5vw,3.3rem)}
.hello h1 button{color:inherit;text-align:left;display:inline}
.hello h1 .q{color:var(--red)}
[data-mood=dinner] .hello h1 .q,[data-mood=late] .hello h1 .q{color:#FF4A3D}
.homegrid{display:grid;gap:16px}
@media (min-width:960px){.homegrid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}.homegrid .rightcol{position:sticky;top:90px}}
.livemap{position:relative;border-radius:26px;overflow:hidden;background:var(--sea);border:1px solid var(--line)}
.livemap .citymap{width:100%;height:auto}
.livemap .ov{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.livemap .ov>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:.82rem;font-weight:800;box-shadow:var(--shadow);white-space:nowrap}
.pill .live{width:8px;height:8px;border-radius:50%;background:#26B35A;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.livemap .legend{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:.76rem;font-weight:700;padding:8px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.legend .ramp{flex:1;height:8px;border-radius:9px;max-width:140px}
.legend .s2{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
.citymap{touch-action:manipulation}
.citymap .blk{cursor:pointer}
.citymap .blk polygon{transform-box:fill-box;transform-origin:center;transition:transform .35s var(--spring),fill .6s,opacity .4s;stroke:var(--street);stroke-width:2.5}
.citymap .blk:hover polygon{transform:scale(1.08)}
.citymap .blk:focus-visible polygon{stroke:var(--acc);stroke-width:6}
.citymap .blk.dim polygon{opacity:.35}
.citymap .blk.sel polygon{stroke:var(--ink);stroke-width:6}
.citymap .blk.ghost polygon{opacity:.55}
.citymap .avenue{stroke:var(--street);fill:none;pointer-events:none;stroke-linecap:round;transition:stroke .6s}
.citymap .sea{fill:var(--sea)}
.citymap .mlabel{font:800 13px var(--body);fill:var(--muted);pointer-events:none;paint-order:stroke;stroke:var(--street);stroke-width:5px}
.citymap .blabel{paint-order:stroke;stroke:var(--sea);stroke-width:8px;stroke-linejoin:round;font:900 44px var(--disp);font-stretch:125%;letter-spacing:-.03em;fill:var(--ink);opacity:.9;pointer-events:none}
.citymap .slabel{font:700 italic 22px var(--body);fill:var(--muted);opacity:.7;pointer-events:none}
.citymap .bsmile{fill:none;stroke:#1B1310;stroke-width:5;stroke-linecap:round;pointer-events:none}
.citymap .glow{fill:none;stroke:#FFA800;stroke-width:3;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.85;transform:scale(1.16)}}
.feed{display:grid;gap:10px}
.post{position:relative;padding:14px;display:grid;gap:10px}
.post .hd{display:flex;align-items:center;gap:10px}
.post .hd .who{flex:1;line-height:1.25;font-size:.92rem}
.post .hd .who b{font-weight:800}
.post .hd .who small{display:block;color:var(--muted);font-size:.8rem}
.post .sm{display:flex;align-items:center;gap:6px;font-weight:850;white-space:nowrap}
.post .body{display:flex;gap:12px;align-items:center}
.post .body>a,.post .hd>a,.predict .pn,.code span,.here,.top .ib,.mini .pos{flex:none}
.post .take{font-size:1.04rem;line-height:1.4;font-weight:550}
.post .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.post .acts .sp{margin-left:auto}
.cl{position:absolute;inset:0;z-index:1;border-radius:inherit}
.sw{width:52px;height:52px;border-radius:14px;flex:none;overflow:hidden;position:relative;display:block}
.sw svg{position:absolute;inset:-10%;width:120%;height:120%}
.sw.lg{width:64px;height:64px;border-radius:16px}

/* chalk board */
.board{position:relative;border-radius:18px;padding:16px 16px 18px;background:#232A27;color:#F4F1EA;box-shadow:inset 0 0 0 6px #3B2A1E,inset 0 0 0 7px #2A1D14,0 16px 30px -18px rgba(0,0,0,.6);display:grid;gap:8px;min-height:250px;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 20%,rgba(255,255,255,.06),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.015) 0 2px,transparent 2px 7px);pointer-events:none}
.board>*{position:relative}
.board>.cl{position:absolute;inset:0;z-index:3;border-radius:18px}
.board>.cl:focus-visible{outline-offset:-4px}
.board:not(.bigboard){cursor:pointer;transition:transform .3s var(--spring)}
.board:not(.bigboard):hover{transform:translateY(-3px) rotate(-.4deg)}
.board .bt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.board .bn{font-family:var(--disp);font-stretch:100%;font-weight:800;font-size:1.02rem;line-height:1.15}
.board .bn small{display:block;font:600 .76rem var(--body);opacity:.7;margin-top:2px}
.board .pr{font:700 1.9rem/1 var(--chalk);color:#FFD27A;transform:rotate(-6deg);white-space:nowrap;padding:4px 8px;border:2px solid rgba(255,210,122,.7);border-radius:50% 46% 52% 48%}
.board .course{font:500 1.18rem/1.15 var(--chalk)}
.board .course b{font:700 .72rem var(--body);opacity:.6;display:block;margin-bottom:1px}
.board .incl{font:500 1.02rem var(--chalk);opacity:.8;border-top:1px dashed rgba(255,255,255,.25);padding-top:6px}
.board.off{opacity:.78}
.board .tmrw{position:absolute;right:14px;bottom:12px;font:700 1.25rem var(--chalk);color:#FFD27A;transform:rotate(-8deg)}
.bigboard{min-height:0}
.foryou{position:relative;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.foryou .art{height:128px;background:var(--c1);position:relative;overflow:hidden}
.foryou .art>svg{position:absolute;right:-18px;bottom:-26px;width:160px;height:160px;transition:transform .5s var(--spring)}
.foryou:hover .art>svg{transform:rotate(-8deg) scale(1.05)}
.foryou .art .pred{position:absolute;left:12px;top:12px;background:#fff;color:#1B1310;border-radius:14px;padding:6px 10px 7px;display:grid;line-height:1.05;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.foryou .art .pred small{font-size:.68rem;font-weight:800;color:#6B5F57}
.foryou .art .pred b{font-family:var(--disp);font-stretch:110%;font-size:1.4rem;font-weight:900;display:flex;align-items:center;gap:6px}
.foryou .tb{padding:12px 14px 14px;display:grid;gap:4px;align-content:start}
.foryou .tb b{font-family:var(--disp);font-stretch:110%;font-weight:850;font-size:1.12rem;line-height:1.1}
.foryou .tb small{color:var(--muted);font-size:.82rem}
.why{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.pl{position:relative;display:grid;gap:8px}
.cover{aspect-ratio:1;border-radius:18px;overflow:hidden;position:relative;background:var(--lc);color:#fff;display:grid;align-content:end;padding:12px;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;background-image:var(--panot);background-size:42px;z-index:-1;opacity:.9}
.cover .mos{position:absolute;right:-12%;top:-10%;width:78%;aspect-ratio:1;display:grid;grid-template-columns:1fr 1fr;gap:5px;transform:rotate(8deg);z-index:-1}
.cover .mos span{border-radius:12px;overflow:hidden;position:relative;box-shadow:0 8px 16px -8px rgba(0,0,0,.5)}
.cover .mos svg{position:absolute;inset:-10%;width:120%;height:120%}
.cover::after{content:"";position:absolute;inset:38% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:-1}
.cover b{font-family:var(--disp);font-stretch:118%;font-weight:900;font-size:1.25rem;line-height:1;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.cover .cnt{position:absolute;left:12px;top:10px;font-weight:850;font-size:.78rem;background:rgba(0,0,0,.35);padding:3px 9px;border-radius:99px}
.pl .meta{font-size:.84rem;color:var(--muted);line-height:1.3}
.pl .meta b{color:var(--ink);font-weight:800}
.plgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.plgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.plgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.newpl{aspect-ratio:1;border-radius:18px;border:2px dashed var(--line);display:grid;place-items:center;align-content:center;gap:8px;text-align:center;padding:12px;transition:border-color .2s,transform .3s var(--spring)}
.newpl:hover{border-color:var(--ink);transform:translateY(-2px)}
.newpl .plus{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center}
.newpl b{font-weight:850}
.banner{margin-top:30px;border-radius:var(--r);overflow:hidden;display:grid;background:#24321F;color:#EFF5E8;position:relative}
.banner .bb{padding:18px 20px;display:grid;gap:8px}
.banner h3{font-family:var(--disp);font-stretch:110%;font-weight:850;font-size:1.3rem;line-height:1.1}
.banner p{opacity:.9;font-size:.94rem}
.banner a{font-weight:800;color:#C9F27A;font-size:.86rem;min-height:40px;display:inline-flex;align-items:center}
.banner .art{min-height:120px;background:#2F4228;position:relative;overflow:hidden}
.banner .art svg{position:absolute;inset:0;width:100%;height:100%}
@media (min-width:700px){.banner{grid-template-columns:220px 1fr}}
.foot{margin-top:56px;padding:20px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center;font-size:.82rem;color:var(--muted)}
.foot a{min-height:44px;display:inline-flex;align-items:center;font-weight:750;color:var(--ink)}
.foot p{flex-basis:100%}

/* explore */
.exgrid{display:grid;gap:14px}
@media (min-width:960px){.exgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:start}.exgrid .mapcol{position:sticky;top:90px}}
.exhead{display:grid;gap:12px;padding:10px 0 4px}
.exhead h1{font-size:clamp(2rem,8vw,3rem)}
.exmap{border-radius:24px;overflow:hidden;background:var(--sea);border:1px solid var(--line);position:relative}
.exmap .citymap{width:100%;height:auto;display:block}
@media (max-width:959px){.exmap .citymap{height:min(80vw,340px)}}
.exbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rows{display:grid;gap:10px}
.prow{position:relative;display:grid;grid-template-columns:auto 64px minmax(0,1fr);gap:12px;align-items:center;padding:12px;transition:transform .3s var(--spring),box-shadow .3s}
.prow:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.prow .rk{font-family:var(--disp);font-stretch:75%;font-weight:850;font-size:1.9rem;width:1.3em;text-align:center;color:var(--muted);line-height:1}
.prow h3{font-family:var(--disp);font-stretch:108%;font-weight:850;font-size:1.1rem;line-height:1.12}
.prow .mt{font-size:.82rem;color:var(--muted);font-weight:600;margin-top:2px}
.prow .ln{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.prow .sc{display:inline-flex;align-items:center;gap:6px;font-weight:850}
.prow .sc small{font-weight:650;color:var(--muted)}
.prow .tl{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.prow .save{position:absolute;right:10px;top:10px}
.prow .bodyc{padding-right:44px}
.prow.feat{border:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 6%,var(--surface))}
.prow.feat .rk{font-size:0;width:1.3em}
.prow .paid{margin-bottom:6px}
.fnote{grid-column:1/-1;font-size:.78rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:36px 18px;border:2px dashed var(--line);border-radius:var(--r)}
.empty b{font-family:var(--disp);font-stretch:110%;font-weight:850;font-size:1.3rem}
.empty p{color:var(--muted);max-width:36ch}

/* restaurant */
.rhero{position:relative;margin:0 -16px;padding:calc(10px + env(safe-area-inset-top)) 16px 22px;background:var(--c1);color:var(--fg);overflow:hidden;display:grid;gap:12px;min-height:330px;align-content:space-between;isolation:isolate}
@media (min-width:960px){.rhero{margin:8px 0 0;border-radius:28px;padding:22px 28px 28px;min-height:360px}}
.rhero .big{position:absolute;right:-70px;top:-10px;width:min(80vw,420px);height:auto;z-index:-1;transition:transform 1s var(--ease)}
.rhero:hover .big{transform:rotate(-4deg)}
@media (max-width:600px){.rhero .big{opacity:.5}}
.rhero .nav{display:flex;gap:8px;align-items:center}
.rhero .nav .ib{background:rgba(0,0,0,.22);color:inherit}
.rhero .nav .ib:hover{background:rgba(0,0,0,.35)}
.rhero .nav .save{background:rgba(0,0,0,.22);color:inherit}
.rhero .nav .save[aria-pressed=true]{background:var(--fg);color:var(--c1)}
.rhero .nav .sp{margin-left:auto}
.rhero h1{font-size:clamp(2.3rem,10.5vw,4.4rem);max-width:13ch}
.rhero .mt{font-weight:700;font-size:.95rem;opacity:.95;display:flex;flex-wrap:wrap;gap:4px 10px}
.rhero .mt span{white-space:nowrap}
.rhero .tl{display:flex;gap:6px;flex-wrap:wrap}
.rgrid{display:grid;gap:14px;margin-top:14px}
@media (min-width:960px){.rgrid{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}}
.col{display:grid;gap:14px;align-content:start}
.pad{padding:18px}
.pad h2{font-family:var(--disp);font-stretch:112%;font-weight:850;font-size:1.3rem;line-height:1.1;margin-bottom:12px}
.scorebox{display:grid;gap:14px}
.scorebox .top3{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.scorebox .n{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:clamp(3.4rem,15vw,4.6rem);line-height:.85;letter-spacing:-.04em}
.scorebox .n small{font-size:1.1rem;color:var(--muted);font-weight:600;letter-spacing:0}
.scorebox .w{font-family:var(--disp);font-stretch:110%;font-weight:850;font-size:1.5rem;line-height:1}
.scorebox .w small{display:block;font:650 .84rem var(--body);color:var(--muted);margin-top:4px}
.curve{width:100%;height:auto}
.curve .ind{fill:none;stroke:var(--smile);stroke-width:2;opacity:.18}
.curve .avg{fill:none;stroke:var(--smile);stroke-width:13;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:640;animation:draw 1.1s .1s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;align-items:end;height:84px}
.hist div{display:grid;justify-items:center;gap:4px;height:100%;align-content:end;font-size:.68rem;color:var(--muted);font-weight:700;text-align:center}
.hist span{width:100%;border-radius:8px 8px 3px 3px;background:var(--smile);transform-origin:bottom;animation:rise .8s var(--spring) both}
@keyframes rise{from{transform:scaleY(0)}}
.compare{display:grid;gap:8px}
.cmp{display:grid;grid-template-columns:92px minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.88rem;font-weight:700}
.cmp .bar{height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:9px;background:var(--smile);transform-origin:left;animation:grow .9s var(--spring) both}
.cmp.vis .bar i{background:var(--muted)}
@keyframes grow{from{transform:scaleX(0)}}
.verdict{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft);font-size:.92rem}
.verdict svg{width:40px;height:18px;flex:none;margin-top:3px}
.verdict b{font-weight:850}
.predict{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:var(--ink);color:var(--bg)}
.predict .pn{font-family:var(--disp);font-stretch:95%;font-weight:900;font-size:2.4rem;line-height:.9;white-space:nowrap}
.predict p{font-size:.88rem;opacity:.85;line-height:1.35}
.predict b{opacity:1}
.ctas{display:grid;grid-template-columns:1fr auto;gap:10px}
.takes{display:grid;gap:10px}
.tk{padding:14px;border-radius:16px;background:var(--soft);display:grid;gap:8px}
.tk p{font-size:1.02rem;line-height:1.42;font-weight:550}
.tk .by{display:flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--muted);flex-wrap:wrap}
.tk .by .lg{font-size:.7rem;font-weight:850;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.tk .tr{margin-left:auto;font-weight:850;color:var(--acc);min-height:36px}
.orders{display:grid;gap:10px}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.ord b{font-weight:750}
.ord small{color:var(--muted);font-weight:700;white-space:nowrap}
.ord .bar{grid-column:1/-1;height:8px;border-radius:9px;background:var(--soft);overflow:hidden}
.ord .bar i{display:block;height:100%;border-radius:9px;background:var(--smile);transform-origin:left;animation:grow .9s var(--spring) both}
.hours{width:100%;border-collapse:collapse;font-size:.92rem}
.hours td{padding:8px 0;border-bottom:1px solid var(--line)}
.hours td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hours tr.td td{font-weight:850}
.hours tr.td td:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:8px;vertical-align:middle}
.minimap{border-radius:16px;overflow:hidden;background:var(--sea);margin:10px 0 12px}
.friendsbeen{display:flex;flex-wrap:wrap;gap:8px}
.fb{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--soft);font-size:.84rem;font-weight:800;position:relative}
.mini{position:relative;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;min-height:60px;transition:background .2s;width:100%;text-align:left}
.mini:hover{background:var(--soft)}
.mini b{display:block;font-weight:800;line-height:1.2}
.mini small{color:var(--muted);font-size:.82rem}
.mini .end{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:850;flex:none}
.mini .sw{width:44px;height:44px;border-radius:12px}

/* lists page */
.lhero{display:grid;gap:16px;padding:12px 0 4px}
@media (min-width:700px){.lhero{grid-template-columns:240px minmax(0,1fr);align-items:end}}
.lhero .cover{max-width:280px;width:100%}
.lhero h1{font-size:clamp(2rem,8vw,3.2rem)}
.lhero .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:18px;background:var(--soft);margin:14px 0}
.callout p{flex:1;min-width:200px;font-size:.92rem}

/* passport */
.pcover{position:relative;margin:0 -16px;padding:18px 16px 22px;background:var(--hero);color:var(--onhero);overflow:hidden;display:grid;gap:16px;isolation:isolate}
.pcover::before{content:"";position:absolute;inset:0;background-image:var(--panot);background-size:56px;z-index:-1}
@media (min-width:960px){.pcover{margin:8px 0 0;border-radius:28px;padding:26px 28px}}
.pcover .who{display:flex;gap:14px;align-items:center}
.pcover .who .av{width:68px;height:68px;font-size:1.4rem;background:#FFA800;color:#3A0A06;box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.pcover h1{font-size:clamp(1.9rem,8vw,3rem)}
.pcover .badge{display:inline-flex;align-items:center;gap:6px;background:#1B1310;color:#FFD27A;font-size:.78rem;font-weight:850;padding:4px 10px;border-radius:99px;margin-top:6px}
.pcover .gear{position:absolute;right:12px;top:12px;background:rgba(0,0,0,.2);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stats div{display:grid}
.stats b{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:clamp(1.6rem,7vw,2.3rem);line-height:1}
.stats span{font-size:.74rem;font-weight:700;opacity:.9;line-height:1.2}
.pgrid{display:grid;gap:14px;margin-top:14px}
@media (min-width:960px){.pgrid{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.stamp{aspect-ratio:1;display:grid;place-items:center;text-align:center;position:relative;transform:rotate(var(--rot));transition:transform .35s var(--spring)}
.stamp:hover{transform:rotate(0) scale(1.05)}
.stamp svg{position:absolute;inset:0;width:100%;height:100%}
.stamp .st{position:relative;display:grid;gap:1px;padding:0 10px}
.stamp b{font-family:var(--disp);font-stretch:100%;font-weight:850;font-size:.86rem;line-height:1.05}
.stamp small{font-size:.62rem;font-weight:800}
.stamp.off{color:var(--muted)}
.stamp.on{color:var(--acc)}
.stamp.fresh{animation:thunk .6s var(--spring)}
@keyframes thunk{from{transform:rotate(var(--rot)) scale(1.7);opacity:0}}
.rank{display:grid;gap:2px;counter-reset:r}
.rank .mini{padding:8px 6px}
.rank .pos{font-family:var(--disp);font-stretch:75%;font-weight:850;font-size:1.3rem;width:1.6em;text-align:center;color:var(--muted);flex:none}
.taste{display:grid;gap:9px}
.taste .cmp{grid-template-columns:110px minmax(0,1fr) auto}
.invite{display:grid;gap:12px;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
.invite h3{font-family:var(--disp);font-stretch:112%;font-weight:850;font-size:1.3rem;line-height:1.1}
.invite p{opacity:.85;font-size:.92rem}
.code{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code span{font-family:var(--disp);font-stretch:125%;font-weight:900;font-size:1.5rem;letter-spacing:.04em;padding:8px 14px;border-radius:12px;border:2px dashed currentColor}
.slots3{display:flex;gap:6px}
.slots3 i{width:28px;height:12px;border-radius:9px;background:#FFA800}
.slots3 i.used{background:rgba(255,255,255,.2)}
.people{display:grid;gap:4px}
.person{position:relative;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px}
.person:hover{background:var(--soft)}
.person .av{width:44px;height:44px;font-size:.9rem}
.person .pi{flex:1;line-height:1.25}
.person .pi b{display:block;font-weight:800}
.person .pi small{color:var(--muted);font-size:.8rem}
.match{display:inline-flex;align-items:center;gap:4px;font-weight:850;font-size:.8rem;color:var(--acc);white-space:nowrap}
.ucover{position:relative;margin:0 -16px;padding:18px 16px 22px;background:var(--pc);color:#fff;display:grid;gap:14px;overflow:hidden;isolation:isolate}
.ucover::before{content:"";position:absolute;inset:0;background-image:var(--panot);background-size:56px;z-index:-1}
@media (min-width:960px){.ucover{margin:8px 0 0;border-radius:28px;padding:26px 28px}}
.ucover h1{font-size:clamp(1.9rem,8vw,3rem)}
.ucover .who{display:flex;gap:14px;align-items:center}
.ucover .who .av{box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.ustats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;max-width:520px}
.ustats>div{display:grid;align-content:start;gap:2px}
.ustats b{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:clamp(1.6rem,7vw,2.2rem);line-height:1}
.ustats span{font-size:.76rem;font-weight:750;opacity:.9}
.ustats .um b{color:#FFD27A}
.mbar{display:block;height:6px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:4px}
.mbar i{display:block;height:100%;border-radius:9px;background:#FFA800;transform-origin:left;animation:grow 1s .2s var(--spring) both}
.ucover .follow{background:#fff;color:#1B1310;justify-self:start}
.ucover .follow[aria-pressed=true]{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.7)}
.vs{display:grid;gap:8px}
.vsr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:.9rem}
.vsr b{font-weight:800}
.vsr .v{display:grid;justify-items:center;font-weight:850;font-size:.86rem;line-height:1.1;min-width:44px}
.vsr .v small{font-size:.66rem;color:var(--muted);font-weight:700}

/* how / biz */
.page{max-width:820px}
.page h1{font-size:clamp(2.1rem,8vw,3.4rem);margin:14px 0 10px}
.page .lede{font-size:1.08rem;color:var(--muted);max-width:60ch}
.steps{display:grid;gap:12px;margin-top:22px}
.step{display:grid;gap:12px;padding:18px}
@media (min-width:760px){.step{grid-template-columns:minmax(0,1fr) 260px;align-items:center}}
.step h2{font-family:var(--disp);font-stretch:112%;font-weight:850;font-size:1.25rem;margin-bottom:6px;line-height:1.1}
.step p{color:var(--muted)}
.formula{font:600 .86rem ui-monospace,Menlo,monospace;background:var(--soft);padding:10px 12px;border-radius:10px;margin-top:10px;overflow-wrap:anywhere}
.price{display:grid;gap:12px;padding:22px;border-radius:var(--r);background:var(--hero);color:#fff;position:relative;overflow:hidden;isolation:isolate}
.price::before{content:"";position:absolute;inset:0;background-image:var(--panot);background-size:56px;z-index:-1}
.price .amt{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:4rem;line-height:.9}
.price .amt small{font:700 1rem var(--body)}
.price ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.price li{display:flex;gap:10px;align-items:flex-start}
.price li svg{width:20px;height:9px;flex:none;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:12px;border-radius:14px;background:var(--soft)}
.kpi small{display:block;font-size:.76rem;font-weight:750;color:var(--muted)}
.kpi b{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:1.8rem;line-height:1.1}
.kpi em{font-style:normal;font-size:.78rem;font-weight:800;color:var(--acc)}
.faq{display:grid;gap:8px}
.faq details{padding:0 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.faq summary{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:800;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary svg{width:22px;height:10px;flex:none;transition:transform .35s var(--spring)}
.faq details[open] summary svg{transform:scaleY(-1)}
.faq details p{padding:0 0 16px;color:var(--muted)}
.two{display:grid;gap:14px}
@media (min-width:760px){.two{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* overlays */
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;opacity:0;transform:translateY(22px);transition:opacity .28s var(--ease),transform .4s var(--spring),background-color .6s}
.ov.on{opacity:1;transform:none}
.ov[hidden]{display:none}
#search{grid-template-rows:auto auto minmax(0,1fr)}
.ohead{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;max-width:760px;width:100%;margin:0 auto}
.sbox{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:99px;border:2px solid var(--ink);background:var(--surface)}
.sbox svg{width:20px;height:20px;flex:none}
.sbox input{flex:1;border:0;background:none;min-height:48px;font-size:16px;outline:none}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox.soft{border-color:var(--line)}
.otabs{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px;max-width:760px;width:100%;margin:0 auto;scrollbar-width:none}
.otabs::-webkit-scrollbar{display:none}
.obody{overflow-y:auto;padding:4px 14px 40px;overscroll-behavior:contain}
.oin{max-width:760px;margin:0 auto;display:grid;gap:20px}
.grp{display:grid;gap:2px}
.grp h3{font-size:.84rem;font-weight:800;color:var(--muted);display:flex;justify-content:space-between;align-items:center;min-height:36px}
.grp h3 button{color:var(--acc);font-weight:800;min-height:40px}
mark{background:none;color:inherit;box-shadow:inset 0 -.45em 0 rgba(255,168,0,.45)}
.sic{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--soft)}
.sic svg{width:20px;height:20px}

/* rate */
.rate::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 50% at 50% 55%,rgba(255,168,0,.32),transparent 70%);opacity:calc(.1 + var(--v,0)*1.1);transition:opacity .2s}
.rhd{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;position:relative}
.prog{display:flex;gap:6px;flex:1;justify-content:center}
.prog svg{width:40px;height:15px}
.prog path{fill:none;stroke:var(--line);stroke-width:5;stroke-linecap:round;transition:stroke .3s}
.prog .done path{stroke:var(--smile)}
.prog .cur path{stroke:var(--ink)}
.rbd{overflow-y:auto;padding:8px 18px 18px;position:relative}
.rin{max-width:560px;margin:0 auto;display:grid;gap:16px}
.rin h2{font-size:clamp(2rem,8.5vw,3rem)}
.rin .sub{color:var(--muted);font-size:1.02rem}
.rin .ey{font-size:.9rem;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:8px}
.picks{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);text-align:left;min-height:66px;transition:border-color .2s,transform .2s var(--spring)}
.pick:hover{border-color:var(--muted)}
.pick[aria-checked=true]{border-color:var(--ink);transform:scale(1.01)}
.pick b{display:block;font-weight:800}
.pick small{color:var(--muted)}
.pick .tick{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.pick[aria-checked=true] .tick{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick .tick svg{width:14px;height:14px}
.stage{display:grid;justify-items:center;gap:6px;padding:6px 0}
.bigsmile{width:min(90vw,440px);height:auto;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;overflow:visible}
.bigsmile:active{cursor:grabbing}
.bigsmile .track{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:4 10;stroke-linecap:round}
.bigsmile .arc{fill:none;stroke:var(--smile);stroke-linecap:round;filter:drop-shadow(0 8px 18px rgba(255,168,0,.45))}
.bigsmile .knob{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.vd{text-align:center}
.vd .w{font-family:var(--disp);font-stretch:118%;font-weight:900;font-size:clamp(2.2rem,9vw,3.2rem);line-height:1}
.vd .n{font-weight:850;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.hint{display:flex;gap:8px;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted);font-weight:700}
.hint svg{width:16px;height:16px;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(5px)}}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{position:relative;border-radius:22px;overflow:hidden;min-height:210px;background:var(--c1);color:var(--fg);display:grid;align-content:end;padding:14px;text-align:left;transition:transform .3s var(--spring),box-shadow .3s;isolation:isolate}
.dc svg.m{position:absolute;right:-26px;top:-16px;width:150px;height:150px;z-index:-1;opacity:.9}
.dc b{font-family:var(--disp);font-stretch:108%;font-weight:900;font-size:1.15rem;line-height:1.05}
.dc small{font-weight:750;opacity:.9;font-size:.8rem}
.dc:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow)}
.dc:active{transform:scale(.97)}
.dc .yours{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.35);color:#fff;font-size:.72rem;font-weight:850;padding:4px 9px;border-radius:99px}
.same{justify-self:center}
.takebox{width:100%;min-height:110px;padding:16px 18px;border-radius:20px;border:2px solid var(--line);background:var(--surface);font-size:1.25rem;line-height:1.35;font-weight:600;resize:none}
.takebox:focus{border-color:var(--ink);outline:none}
.counter{text-align:right;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rft{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:12px 18px calc(12px + env(safe-area-inset-bottom));max-width:600px;width:100%;margin:0 auto;position:relative}
.rft .btn{flex:1;max-width:300px}


/* the win: a small, fast reward every single time you rate */
.win{display:grid;justify-items:center;text-align:center;gap:10px}
.rate.winning .rbd{display:grid;align-content:center}
.win h2{font-size:clamp(2rem,9vw,2.8rem)}
.burst{position:relative;width:220px;height:220px;display:grid;place-items:center}
.burst::before{content:"";position:absolute;width:132px;height:132px;border-radius:50%;border:3px solid #FFA800;opacity:0;animation:ringout .8s .22s ease-out both}
@keyframes ringout{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.75);opacity:0}}
.rays{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ray{fill:none;stroke-width:6;stroke-linecap:round;transform-box:fill-box;transform-origin:center;opacity:0;animation:ray .95s cubic-bezier(.15,.8,.25,1) forwards}
.ray.dot{stroke:none}
@keyframes ray{0%{opacity:0;transform:translateY(-30px) scale(.3)}22%{opacity:1}100%{opacity:0;transform:translateY(var(--d)) scale(1.1)}}
.medal{width:132px;height:132px;border-radius:50%;background:var(--c1);color:var(--fg);display:grid;place-items:center;align-content:center;box-shadow:0 22px 40px -18px rgba(0,0,0,.55),inset 0 0 0 6px rgba(255,255,255,.16);animation:medal .7s var(--spring) both;position:relative}
@keyframes medal{0%{transform:scale(.35) rotate(-14deg);opacity:0}55%{transform:scale(1.13) rotate(3deg);opacity:1}100%{transform:none}}
.medal .ms{width:84px;height:39px;overflow:visible}
.medal .ms path{fill:none;stroke:#FFA800;stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dash .45s .25s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.medal .msn{font-family:var(--disp);font-stretch:90%;font-weight:900;font-size:1.7rem;line-height:1;margin-top:2px}
.odo{display:inline-block;height:1.04em;overflow:hidden;vertical-align:bottom}
.odo>span{display:grid;animation:odo .6s .55s var(--spring) both}
.odo b{display:block;height:1.04em;line-height:1.04;color:var(--red);font-weight:inherit}
[data-mood=dinner] .odo b,[data-mood=late] .odo b{color:#FF4A3D}
@keyframes odo{from{transform:translateY(0)}to{transform:translateY(-50%)}}
.wins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px}
.wchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 14px 6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:800;font-size:.88rem;animation:pop .5s var(--spring) both;animation-delay:calc(.95s + var(--i,0)*.16s)}
@keyframes pop{from{transform:translateY(10px) scale(.75);opacity:0}}
.wk{display:inline-flex;gap:3px;align-items:flex-end}
.wk i{width:6px;height:16px;border-radius:3px;background:var(--smile);opacity:.45}
.wk i:last-child{opacity:1}
.wk i.new{transform-origin:bottom;animation:tick .5s 1.25s var(--spring) both}
@keyframes tick{from{transform:scaleY(0)}}
.oct{width:22px;height:22px}
.oct polygon{fill:var(--cold);animation:lit .6s 1.3s ease-out forwards}
@keyframes lit{to{fill:#E8381A}}
.stamp.mini{width:30px;flex:none;--rot:-8deg}
.stamp.mini .st{display:none}
.mile{width:min(100%,340px);display:grid;gap:6px;margin-top:6px;animation:pop .5s 1.2s var(--spring) both}
.mile .mt{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;font-weight:800}
.mile.hit .mt span:first-child{color:var(--acc)}
.mbar2{display:block;height:10px;border-radius:9px;background:var(--soft);overflow:hidden}
.mbar2 i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FFA800,#E8381A);width:var(--to);animation:fill .9s 1.4s var(--ease) both}
@keyframes fill{from{width:var(--from)}}
.mile.hit .mbar2{box-shadow:0 0 0 3px rgba(255,168,0,.25);animation:glowp 1.2s 2.2s ease-in-out 2}
@keyframes glowp{50%{box-shadow:0 0 0 7px rgba(255,168,0,.15)}}
.rate.winning::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(255,168,0,.34),transparent 58%);animation:flash 1.1s .2s ease-out both}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.btn.done{position:relative;overflow:hidden}
.btn.done .cd{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.65);transform-origin:left;animation:cd 5.2s 1.6s linear both}
@keyframes cd{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.rate.held .btn.done .cd{animation:none;opacity:0}


/* v3.2 additions */
.explain{display:flex;align-items:center;gap:14px;padding:12px 8px 12px 14px;margin:0 0 14px;flex-wrap:wrap}
.explain p{flex:1;min-width:180px;font-size:.92rem}
.explain b{font-weight:850}
.ex3{display:flex;gap:10px}
.ex3 span{display:grid;justify-items:center;gap:1px;font-size:.7rem;color:var(--muted);font-weight:750}
.ex3 b{color:var(--ink);font-size:.86rem}
.tag.calm{background:#DFF3E6;color:#155C32}
.tag.busy{background:#FFE9C2;color:#7A4A00}
[data-mood=dinner] .tag.calm,[data-mood=late] .tag.calm{background:#14361F;color:#A8E6BE}
[data-mood=dinner] .tag.busy,[data-mood=late] .tag.busy{background:#4A3510;color:#FFD98A}
.favmark{display:block;font:800 .68rem var(--body);color:#FFD27A;margin-bottom:3px}
.follow.onhero{justify-self:start;background:var(--fg);color:var(--c1)}
.follow.onhero[aria-pressed=true]{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px currentColor}
.busyline{display:flex;align-items:center;gap:8px;font-size:.92rem;margin:-4px 0 10px;flex-wrap:wrap}
.busyline b{font-weight:850}
.bdot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.bdot.less{background:#26B35A}.bdot.usual{background:#FFA800}.bdot.more{background:#E8381A}
.pt{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;align-items:end;height:112px;padding:6px 0 18px}
.ptc{position:relative;height:100%;display:grid;align-items:end}
.ptc .u{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--cold);transform-origin:bottom;animation:rise .7s var(--spring) both}
.ptc .n{position:absolute;left:18%;right:18%;bottom:0;border-radius:4px;background:var(--red);animation:rise .7s .2s var(--spring) both}
.ptc.cur .u{background:color-mix(in srgb,var(--red) 30%,var(--cold))}
.ptc small{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:.62rem;font-weight:750;color:var(--muted)}
.mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2}
.mapctl .ib{width:42px;height:42px;box-shadow:var(--shadow)}
.mapall{position:absolute;left:10px;top:10px;z-index:2;display:none;border:0}
.exmap.zin .mapall{display:inline-flex}
.citymap .pname{font:800 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;opacity:0;transition:opacity .3s;pointer-events:none}
.citymap.zoomed .pname{opacity:1}
.exmap .citymap{cursor:grab}
.blockhd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.ach{display:grid;justify-items:center;gap:6px;text-align:center}
.ach svg{width:64px;height:64px}
.ach .ab{fill:var(--soft);stroke:var(--line);stroke-width:2}
.ach .af{fill:#FFA800}
.ach.done .af{fill:var(--red)}
.ach text{font:850 13px var(--body);fill:var(--ink)}
.ach b{font-size:.76rem;font-weight:800;line-height:1.15}
.ach:not(.done) b{color:var(--muted)}
.avrow{display:flex;align-items:center;gap:14px}
.switch.wide{width:100%;justify-content:flex-start}
.cal .q5 button{gap:2px;min-height:58px}
.cal .q5 button small{font-size:.62rem;font-weight:800;line-height:1}
.bigsmile .ghost{opacity:0;transition:opacity .4s;pointer-events:none}
.bigsmile .ghost.on{opacity:1}
.bigsmile .garc{fill:none;stroke:var(--ink);stroke-width:4;stroke-dasharray:2 9;stroke-linecap:round;opacity:.35}
.bigsmile .ghand path{fill:#fff;stroke:#1B1310;stroke-width:2.2;stroke-linejoin:round;opacity:.82}
.bigsmile .ghand .tap{fill:none;stroke:#FFA800;stroke-width:3;opacity:.8;transform-box:fill-box;transform-origin:center;animation:tapr 1.2s ease-out infinite}
@keyframes tapr{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}

/* onboarding */
#onb{grid-template-rows:minmax(0,1fr) auto;background:var(--bg)}
#onb.red{background:var(--red);color:#fff}
#onb.red::before{content:"";position:absolute;inset:0;background-image:var(--panot);background-size:64px;pointer-events:none}
.obd{overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 12px;position:relative}
.oinn{max-width:520px;margin:0 auto;display:grid;gap:16px;min-height:100%;align-content:center}
.oinn h1,.oinn h2{font-size:clamp(2.2rem,10vw,3.4rem)}
.oinn .sub{font-size:1.05rem;opacity:.85}
.splash .logo{font-size:clamp(64px,22vw,110px);color:#fff;padding-bottom:22px}
.splash .logo .o svg path{stroke:#FFA800}
.oft{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 20px calc(16px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;position:relative}
.oft .btn{flex:1}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-height:58px;border-radius:16px;border:2px solid var(--line);background:var(--surface);padding:0 16px;font:900 1.4rem var(--disp);font-stretch:125%;letter-spacing:.06em;text-transform:uppercase}
.codein input:focus{border-color:var(--ink);outline:none}
.okmsg{display:flex;align-items:center;gap:10px;font-weight:750;padding:12px 14px;border-radius:14px;background:var(--soft)}
.calib{display:grid;gap:10px}
.cal{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.cal b{font-weight:850;display:block;line-height:1.2}
.cal small{color:var(--muted);font-size:.8rem}
.cal .q5{grid-column:1/-1;display:flex;gap:6px}
.cal .q5 button{flex:1;min-height:48px;border-radius:12px;background:var(--soft);display:grid;place-items:center;transition:background .2s,transform .2s var(--spring)}
.cal .q5 button svg{width:34px;height:16px}
.cal .q5 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.cal .q5 button[aria-pressed=true] path{stroke:#FFA800}
.cal .q5 button.nb{flex:1.4;font-size:.76rem;font-weight:800}

/* sheets */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:90vh;background:var(--surface);color:var(--ink);border-radius:26px 26px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.35);overflow:hidden}
dialog.sheet::backdrop{background:rgba(10,6,4,.5);backdrop-filter:blur(3px)}
dialog.sheet[open]{animation:up .4s var(--spring)}
@keyframes up{from{transform:translateY(100%)}}
@media (min-width:960px){dialog.sheet{margin:auto;border-radius:26px}dialog.sheet[open]{animation:pop .3s var(--spring)}}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.shin{padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:grid;gap:14px;max-height:90vh;overflow-y:auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.shh{display:flex;align-items:center;gap:10px}
.shh h2{flex:1;font-size:1.5rem}
.opt{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 12px;border-radius:16px;border:1.5px solid var(--line);width:100%;text-align:left;transition:border-color .2s,background .2s}
.opt[aria-checked=true]{border-color:var(--ink);background:var(--soft)}
.opt .lc{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff}
.opt .lc svg{width:20px;height:20px}
.opt b{display:block;line-height:1.2;font-weight:800}
.opt small{color:var(--muted)}
.opt .box{margin-left:auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-checked=true] .box{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt .box svg{width:14px;height:14px}
.field{display:grid;gap:6px}
.field label,.field .fl{font-size:.84rem;font-weight:800;color:var(--muted)}
.field input,.field select{min-height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);font-size:16px}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.sgrp{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.sgrp h3{font-family:var(--disp);font-stretch:110%;font-weight:850;font-size:1.05rem}
.proto{border:2px dashed var(--amber);border-radius:18px;padding:14px;display:grid;gap:10px}
.linkrow{display:flex;align-items:center;gap:12px;min-height:50px;font-weight:750;width:100%;text-align:left}
.linkrow svg{width:20px;height:20px}

.toast{position:fixed;left:50%;bottom:96px;z-index:400;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:20px;font-weight:750;font-size:.9rem;display:flex;gap:10px;align-items:center;transition:all .35s var(--spring);pointer-events:none;max-width:min(420px,calc(100vw - 32px));width:max-content}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:960px){.toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}.citymap .glow{display:none}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail" aria-label="Main"></nav>
  <div>
    <header class="top" id="top"></header>
    <main id="main"><div id="view" class="view"></div></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
</div>
<dialog class="sheet" id="dlg"></dialog>
<div class="ov" id="search" role="dialog" aria-modal="true" aria-label="Search" hidden></div>

function scoreFor(r,who){if(who==="locals")return{v:r.sL,n:r.nL};if(who==="visitors")return{v:r.sV,n:r.nV};if(who==="friends"){const f=friendScore(r);return f?{v:f.v,n:f.n}:{v:r.score,n:0}}return{v:r.score,n:r.n}}
function curveSVG(v,seed,spread){const rand=rng(seed),W=420,H=190;let s=`<svg class="curve" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;for(let i=0;i<28;i++){const g=(rand()+rand()+rand()-1.5)*(spread||.42);s+=`<path class="ind" d="${smilePath(clamp(v+g),W,H,20)}"/>`}return s+`<path class="avg" d="${smilePath(v,W,H,20)}"/></svg>`}
function histHTML(v,n,seed,spread){const rand=rng(seed),b=[0,0,0,0,0];const m=Math.max(n,40);for(let i=0;i<m;i++){const x=clamp(v+(rand()+rand()+rand()-1.5)*(spread||.42));b[Math.min(4,Math.floor(x*5))]++}const mx=Math.max(...b)||1;
  return`<div class="hist" role="img" aria-label="${t("words").map((w,i)=>`${w}: ${Math.round(b[i]/m*100)}%`).join(", ")}">${b.map((c,i)=>`<div><span style="height:${Math.max(4,c/mx*58)}px;animation-delay:${i*.06}s"></span>${t("words")[i]}</div>`).join("")}</div>`}
function verdict(r){const l=sc(r.sL),v=sc(r.sV);if(r.sV-r.sL>.2)return t("vPass",l,v);if(r.split)return t("vSplit");if(r.sL-r.sV>.12)return t("vSecret",l,v);return t("vEven",l,v)}
function scoreBox(r,who){const s=scoreFor(r,who),f=friendScore(r),spread=r.split?.7:who==="visitors"?.5:.4;const seed=hash(r.id+who);
  const tabs=[["everyone","everyone"],["locals","locals"],["visitors","visitors"]].concat(f?[["friends","friends"]]:[]);

  <div class="top3"><span class="n num">${sc(s.v)}<small> /10</small></span><span class="w">${wordOf(s.v)}<small>${num(s.n)} ${who==="everyone"?t("smiles"):t(who)}</small></span></div>
  ${curveSVG(s.v,seed,spread)}<p class="small muted">${t("curveCap",num(s.n))}</p>
  <div class="compare">${[["locals",r.sL,""],["visitors",r.sV," vis"]].concat(f?[["friends",f.v,""]]:[]).map(([k,v,c])=>`<div class="cmp${c}"><span>${t(k)[0].toUpperCase()+t(k).slice(1)}</span><span class="bar"><i style="width:${v*100}%"></i></span><b class="num">${sc(v)}</b></div>`).join("")}</div>

function mountSmile(host,init,onChange,interactive){

  const HAND="M-5 4a5 5 0 0 1 10 0v17h1a4 4 0 0 1 8 1v1a4 4 0 0 1 7 2v14c0 10-7 17-17 17h-5c-6 0-10-3-13-8l-8-13a4.5 4.5 0 0 1 7.5-5l4.5 5V4z";
  host.innerHTML=`<svg class="bigsmile" viewBox="0 0 ${W} ${H}" ${interactive?`role="slider" tabindex="0" aria-label="${t("r_slider")}" aria-valuemin="0" aria-valuemax="10"`:'aria-hidden="true"'}><path class="track" d="${geo(1,0).d}"/><path class="track" d="${geo(0,0).d}"/><path class="arc" d=""/>${interactive?`<g class="ghost" aria-hidden="true"><path class="garc" d=""/><g class="ghand"><circle class="tap" r="12"/><path d="${HAND}"/></g></g><circle class="knob" r="14"/>`:""}</svg>`;

  function draw(){const ten=clamp(Math.abs(target-cur)*3),sq=(drag?8:0)+ten*22,g=geo(cur,sq);arc.setAttribute("d",g.d);arc.setAttribute("stroke-width",(16+ten*6+(drag?2:0)).toFixed(1));if(knob){knob.setAttribute("cx",g.mx);knob.setAttribute("cy",g.my.toFixed(1))}}
  function tick(ts){const dt=last?Math.min(.033,(ts-last)/1000):.016;last=ts;const k=drag?620:240,c=drag?38:11;vel+=(k*(target-cur)-c*vel)*dt;cur+=vel*dt;draw();
    if(!drag&&Math.abs(vel)<.002&&Math.abs(target-cur)<.002){cur=target;draw();raf=0;last=0;return}raf=requestAnimationFrame(tick)}
  function kick(){if(reduced.matches){cur=target;draw();return}if(!raf){last=0;raf=requestAnimationFrame(tick)}}
  function set(v,quiet){target=clamp(v);const idx=Math.min(4,Math.floor(target*5));if(idx!==lastIdx){lastIdx=idx;if(!quiet&&navigator.vibrate)try{navigator.vibrate(6)}catch(e){}}

  const toV=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return(q.y-BASE)/112};

    const tids=[[260,.94],[760,.06],[1220,init]].map(([ms,v])=>setTimeout(()=>{if(!touched&&svg.isConnected)set(v,true)},ms));
    function startGhost(){if(touched||!svg.isConnected)return;ghost.classList.add("on");const t0=performance.now();
      (function loop(n){if(touched||!svg.isConnected){ghost.classList.remove("on");return}const ph=((n-t0)%2400)/2400,e=ph<.5?ph*2:2-ph*2,s=e*e*(3-2*e),g=geo(init+(1-init)*.85*s,0);
        gArc.setAttribute("d",g.d);gHand.setAttribute("transform",`translate(${g.mx} ${g.my.toFixed(1)})`);gRaf=requestAnimationFrame(loop)})(t0)}
    const gT=setTimeout(startGhost,4200);
    const stop=()=>{if(touched)return;touched=true;tids.forEach(clearTimeout);clearTimeout(gT);cancelAnimationFrame(gRaf);ghost.classList.remove("on")};
    svg.addEventListener("pointerdown",stop);svg.addEventListener("keydown",stop)}
  if(interactive){
    svg.addEventListener("pointerdown",e=>{drag=true;try{svg.setPointerCapture(e.pointerId)}catch(err){}lastY=e.clientY;set(toV(e));e.preventDefault()});

srEl.addEventListener("click",e=>{if(e.target.closest("a[href]"))closeSearch(true)});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(RF.open){e.preventDefault();closeRate();return}if(SR.open){e.preventDefault();closeSearch();return}}
  if(e.key==="/"&&!RF.open&&!SR.open&&!OB.open&&!dlg.open&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();openSearch()}
  const ov=RF.open?rateEl:SR.open?srEl:OB.open?obEl:null;
  if(e.key==="Tab"&&ov){const f=$$('button:not([disabled]),a[href],input,textarea,[tabindex="0"]',ov).filter(x=>x.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
addEventListener("scroll",()=>$("#top").classList.toggle("sc",scrollY>6),{passive:true});

setInterval(()=>{if(!S.sim&&document.documentElement.dataset.mood!==palette()){applyTheme();rerender()}else renderChrome()},60000);
